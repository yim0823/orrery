name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Mermaid diagrams render
        run: |
          npm install --no-save --no-fund --no-audit mermaid@11 jsdom@25
          node scripts/check_mermaid.mjs README.md README.ko.md docs/ARCHITECTURE.md docs/ARCHITECTURE.ko.md

      - name: Internal links resolve
        run: |
          uv run python - <<'PY'
          import pathlib, re, sys
          bad = []
          for md in list(pathlib.Path(".").glob("*.md")) + list(pathlib.Path("docs").glob("*.md")):
              for m in re.finditer(r"\[([^\]]+)\]\(([^)#]+?)(#[^)]*)?\)", md.read_text()):
                  t = m.group(2)
                  if t.startswith(("http", "mailto")):
                      continue
                  if not (md.parent / t).resolve().exists():
                      bad.append(f"{md}: {t}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all internal links resolve")
          PY

      - name: A fresh clone works
        run: ./scripts/smoke.sh
