notes: |
  Same trigger as INC-0003 and a different outcome, because the outage lasted longer.
  A soft dependency is soft up to a point: checkout queued and retried, then ran out of
  room and stopped accepting orders.

  The relation declares tolerance_s: 2400, so past forty minutes the engine treats the
  edge as hard. This pair is the argument for putting a clock in the model at all: one
  trigger, two truths, and only the duration tells them apart.
