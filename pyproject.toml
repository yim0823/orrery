[project]
name = "orrery"
version = "0.0.1"
description = "Infrastructure world engine: every server is on the map, and every action computes a consequence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.3",
  "simpy>=4.1",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
orrery = "orrery.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orrery"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
