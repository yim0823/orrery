[project]
# The distribution is `orrery-engine`; the import and the command are `orrery`.
# `orrery` on PyPI is an unrelated project (an MVC/observer framework, last released in
# 2025), so the short name was never available to take.
name = "orrery-engine"
version = "0.3.0"
description = "Infrastructure world engine: every server is on the map, and every action computes a consequence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "TaeHyoung Yim" }]
keywords = ["infrastructure", "sre", "blast-radius", "dependency-graph", "incident-response"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.3",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]

# A plain `uv sync` installs these, so `uv run pytest` works on a fresh clone without
# anyone having to read a flag out of the contributing guide first.
[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/yim0823/orrery"
Source = "https://github.com/yim0823/orrery"
Changelog = "https://github.com/yim0823/orrery/blob/main/CHANGELOG.md"
Issues = "https://github.com/yim0823/orrery/issues"

# The command stays `orrery`. It is what the documentation types and what people say.
[project.scripts]
orrery = "orrery.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orrery"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
